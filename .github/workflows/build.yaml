name: Build libmpv-android (AES-ECB)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: mkdir sdk && ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle (default)
        working-directory: ./buildscripts
        run: chmod +x *.sh include/*.sh && ./bundle_default.sh
      - name: Verify patch applied
        working-directory: ./buildscripts
        run: grep -q "aes_ecb_key" deps/ffmpeg/libavformat/hls.c && grep -q "crypto_ecb_dummy_iv" deps/ffmpeg/libavformat/crypto.c
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-default-aes-ecb
          path: buildscripts/artifacts/default/*.jar
